services:
  aurita:
    image: ghcr.io/gnmyt/aurita:latest
    container_name: aurita
    restart: unless-stopped
    environment:
      JELLYFIN_SERVER: ${JELLYFIN_SERVER:-}
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/tv/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
