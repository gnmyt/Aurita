name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: "Create Release"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      semver: ${{ steps.get_version.outputs.semver }}
      prerelease: ${{ steps.get_version.outputs.prerelease }}
      release_id: ${{ steps.create_release.outputs.release_id }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          SEMVER="${VERSION%%-*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "$SEMVER" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Aurita ${{ steps.get_version.outputs.version }}" \
            --draft \
            --notes "Build in progress…" \
            ${{ steps.get_version.outputs.prerelease == 'true' && '--prerelease' || '' }}
          ID=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '[.[] | select(.tag_name == "${{ github.ref_name }}")][0].id')
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "Could not find release for tag ${{ github.ref_name }}" >&2
            exit 1
          fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  build-docker:
    name: "Build Docker"
    needs: create-release
    uses: ./.github/workflows/build-docker.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      tags: |
        ${{ needs.create-release.outputs.version }}
        ${{ needs.create-release.outputs.semver }}
        ${{ needs.create-release.outputs.prerelease == 'false' && 'latest' || '' }}
    secrets: inherit

  build-android:
    name: "Build Android TV"
    needs: create-release
    uses: ./.github/workflows/build-android.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      semver: ${{ needs.create-release.outputs.semver }}
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  finalize-release:
    name: "Finalize Release"
    needs: [create-release, build-docker, build-android]
    uses: ./.github/workflows/finalize-release.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      semver: ${{ needs.create-release.outputs.semver }}
      release_id: ${{ needs.create-release.outputs.release_id }}
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  cleanup-on-failure:
    name: "Cleanup on Failure"
    runs-on: ubuntu-latest
    needs: [create-release, build-docker, build-android]
    if: failure()
    steps:
      - name: Delete release and tag
        uses: actions/github-script@v7
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const releaseId = Number('${{ needs.create-release.outputs.release_id }}');
            if (releaseId) {
              try {
                await github.rest.repos.deleteRelease({ ...repo, release_id: releaseId });
                console.log('Release deleted');
              } catch (e) {
                console.log('Failed to delete release:', e.message);
              }
            }
            try {
              await github.rest.git.deleteRef({ ...repo, ref: 'tags/${{ github.ref_name }}' });
              console.log('Tag deleted');
            } catch (e) {
              console.log('Failed to delete tag:', e.message);
            }
