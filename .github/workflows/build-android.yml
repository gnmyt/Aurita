name: Build Android TV

on:
  workflow_call:
    inputs:
      version:
        description: "Full version, e.g. 1.2.3 or 1.2.3-beta.1"
        required: true
        type: string
      semver:
        description: "Plain semver without pre-release suffix, e.g. 1.2.3"
        required: true
        type: string
      release_tag:
        description: "Release tag to attach the artifacts to; empty = artifacts only"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  web:
    name: "Web bundle"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_BASE: /
        run: npm run build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  package:
    name: "${{ matrix.label }}"
    runs-on: ubuntu-latest
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: APK
            task: ":app:assembleRelease"
            output: android/app/build/outputs/apk/release/app-release.apk
            extension: apk
            content_type: application/vnd.android.package-archive
          - label: AAB
            task: ":app:bundleRelease"
            output: android/app/build/outputs/bundle/release/app-release.aab
            extension: aab
            content_type: application/octet-stream

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: android/app/src/main/assets/www

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set — cannot sign the release build."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compute version code
        id: vc
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ inputs.semver }}"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          [ "$CODE" -gt 0 ] || CODE=1
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.label }}
        working-directory: android
        env:
          VERSION_NAME: ${{ inputs.version }}
          VERSION_CODE: ${{ steps.vc.outputs.code }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew ${{ matrix.task }} --no-daemon

      - name: Rename artifact
        id: artifact
        run: |
          NAME="aurita-tv-${{ inputs.version }}.${{ matrix.extension }}"
          mv "${{ matrix.output }}" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurita-tv-${{ matrix.extension }}
          path: ${{ steps.artifact.outputs.name }}
          if-no-files-found: error

      - name: Attach to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.release_tag }}" "${{ steps.artifact.outputs.name }}" --clobber
