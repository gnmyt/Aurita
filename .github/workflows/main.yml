name: Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: "Lint & Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  build-docker:
    name: "Build Docker"
    needs: check
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-docker.yml
    with:
      version: dev-${{ github.sha }}
      tags: dev
    secrets: inherit

  build-android:
    name: "Build Android TV"
    needs: check
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-android.yml
    with:
      version: dev-${{ github.run_number }}
      semver: 0.0.0
    secrets: inherit
