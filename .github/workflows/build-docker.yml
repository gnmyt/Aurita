name: Build Docker

on:
  workflow_call:
    inputs:
      version:
        description: "Version baked into the image (informational)"
        required: true
        type: string
      tags:
        description: "Newline-separated list of tags to publish (empty lines ignored)"
        required: true
        type: string
      image:
        description: "Image name without registry, defaults to <owner>/aurita"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: "Image (${{ matrix.platform_arch }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - platform_arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Resolve image name
        id: img
        run: |
          NAME="${{ inputs.image }}"
          [ -n "$NAME" ] || NAME="${{ github.repository_owner }}/aurita"
          echo "name=ghcr.io/$(echo "$NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          labels: |
            org.opencontainers.image.title=Aurita
            org.opencontainers.image.description=Jellyfin TV frontend
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BASE=/tv/
          outputs: type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=aurita-${{ matrix.platform_arch }}
          cache-to: type=gha,mode=max,scope=aurita-${{ matrix.platform_arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform_arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: "Merge Manifests"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Resolve image name
        id: img
        run: |
          NAME="${{ inputs.image }}"
          [ -n "$NAME" ] || NAME="${{ github.repository_owner }}/aurita"
          echo "name=ghcr.io/$(echo "$NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          TAGS: ${{ inputs.tags }}
        run: |
          TAG_ARGS=""
          while IFS= read -r tag; do
            tag="$(echo "$tag" | tr -d '[:space:]')"
            [ -n "$tag" ] || continue
            TAG_ARGS="$TAG_ARGS -t $IMAGE:$tag"
          done <<< "$TAGS"
          if [ -z "$TAG_ARGS" ]; then
            echo "No tags given" >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          docker buildx imagetools create $TAG_ARGS \
            $(printf "$IMAGE@sha256:%s " $(ls "${{ runner.temp }}/digests"))

      - name: Summary
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          TAGS: ${{ inputs.tags }}
        run: |
          {
            echo "### 🐳 Published image"
            echo
            while IFS= read -r tag; do
              tag="$(echo "$tag" | tr -d '[:space:]')"
              [ -n "$tag" ] || continue
              echo "- \`$IMAGE:$tag\`"
            done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
